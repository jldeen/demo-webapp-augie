# Blue/Green Deployment Strategy
# Maintains two identical production environments (blue & green).
# Deploys to the inactive environment, validates, then swaps traffic.
# Enables instant rollback by swapping back to the previous environment.

name: Deploy (Blue/Green)

on:
  workflow_dispatch:
    inputs:
      active-environment:
        description: "Currently active environment (blue or green)"
        required: true
        type: choice
        options:
          - blue
          - green
        default: blue
  workflow_call:
    inputs:
      active-environment:
        description: "Currently active environment (blue or green)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  determine-target:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
      current: ${{ steps.pick.outputs.current }}
    steps:
      - name: Determine inactive environment
        id: pick
        run: |
          if [ "${{ inputs.active-environment }}" = "blue" ]; then
            echo "target=green" >> "$GITHUB_OUTPUT"
            echo "current=blue" >> "$GITHUB_OUTPUT"
          else
            echo "target=blue" >> "$GITHUB_OUTPUT"
            echo "current=green" >> "$GITHUB_OUTPUT"
          fi

  deploy-to-inactive:
    needs: determine-target
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.determine-target.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to ${{ needs.determine-target.outputs.target }}
        run: |
          echo "🔵 Deploying to ${{ needs.determine-target.outputs.target }} environment..."
          sleep 3
          echo "✅ Deployment to ${{ needs.determine-target.outputs.target }} complete"

      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ needs.determine-target.outputs.target }}',
              auto_merge: false,
              required_contexts: [],
              description: 'Blue/Green deployment to ${{ needs.determine-target.outputs.target }}'
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: '${{ needs.determine-target.outputs.target }}',
              description: 'Deployment successful'
            });

      - name: Run health check
        run: |
          echo "Running health check against ${{ needs.determine-target.outputs.target }}..."
          chmod +x scripts/health-check.sh 2>/dev/null || true
          if [ -f scripts/health-check.sh ]; then
            bash scripts/health-check.sh
          else
            sleep 2
            echo "✅ Health check passed"
          fi

  swap-traffic:
    needs: [determine-target, deploy-to-inactive]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Swap traffic from ${{ needs.determine-target.outputs.current }} to ${{ needs.determine-target.outputs.target }}
        run: |
          echo "🔄 Swapping traffic from ${{ needs.determine-target.outputs.current }} to ${{ needs.determine-target.outputs.target }}..."
          sleep 2
          echo "✅ Traffic now routing to ${{ needs.determine-target.outputs.target }}"
          echo "🟢 ${{ needs.determine-target.outputs.current }} environment now idle (previous version)"

      - name: Update production deployment status
        uses: actions/github-script@v7
        with:
          script: |
            // Mark the new active environment as production
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Production traffic routed to ${{ needs.determine-target.outputs.target }}'
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'production',
              description: 'Live — serving from ${{ needs.determine-target.outputs.target }}'
            });

      - name: Verify production health post-swap
        run: |
          echo "Verifying production health after swap..."
          sleep 3
          echo "✅ Production health verified — all endpoints responding"

      - name: Deployment summary
        run: |
          echo "## Blue/Green Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous active | ${{ needs.determine-target.outputs.current }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New active | ${{ needs.determine-target.outputs.target }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollback | Re-run with active=${{ needs.determine-target.outputs.target }} |" >> "$GITHUB_STEP_SUMMARY"
