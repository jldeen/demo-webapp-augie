name: Feature Flag Update

on:
  workflow_dispatch:
    inputs:
      flag_name:
        description: 'Flag to toggle'
        required: true
        type: choice
        options:
          - new_search_algorithm
          - beta_user_profiles
          - ai_suggestions
          - rate_limiting
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      enabled:
        description: 'Enable or disable'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  update-flag:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Toggle feature flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAG="${{ inputs.flag_name }}"
          ENV="${{ inputs.environment }}"
          ENABLED="${{ inputs.enabled }}"

          echo "╔══════════════════════════════════════════════════╗"
          echo "║  FEATURE FLAG UPDATE                             ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "🏁 Flag:        $FLAG"
          echo "🌐 Environment: $ENV"
          echo "📍 New state:   $([ "$ENABLED" = "true" ] && echo "✅ ENABLED" || echo "❌ DISABLED")"
          echo ""

          # Read current flags from the environment config file
          FILE="src/flags/flags.${ENV}.json"
          echo "Current state of $FILE:"
          cat "$FILE" | jq --arg flag "$FLAG" '.[$flag]'
          echo ""

          # Update the flag in-memory and show the change
          echo "After update:"
          jq --arg flag "$FLAG" --argjson enabled $ENABLED \
            '.[$flag].enabled = $enabled' "$FILE" | jq --arg flag "$FLAG" '.[$flag]'

      - name: Simulate deployment
        run: |
          echo ""
          echo "🚀 Deploying feature flag configuration to ${{ inputs.environment }}..."
          sleep 3
          echo "   Updating configuration store..."
          sleep 2
          echo "   Invalidating cached flag values..."
          sleep 1
          echo "   Verifying flag state across instances..."
          sleep 2
          echo ""
          echo "✅ Feature flag '${{ inputs.flag_name }}' is now ${{ inputs.enabled == 'true' && 'ENABLED' || 'DISABLED' }} in ${{ inputs.environment }}"

      - name: Post-deployment verification
        run: |
          echo ""
          echo "🔍 Verification:"
          echo "   Flag: ${{ inputs.flag_name }}"
          echo "   State: ${{ inputs.enabled == 'true' && '✅ Enabled' || '❌ Disabled' }}"
          echo "   Environment: ${{ inputs.environment }}"
          echo "   Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "   Actor: ${{ github.actor }}"
          echo ""
          echo "📋 Audit trail recorded."

      - name: Summary
        run: |
          echo "## 🏁 Feature Flag Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flag | \`${{ inputs.flag_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New State | ${{ inputs.enabled == 'true' && '✅ Enabled' || '❌ Disabled' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | $(date -u +"%Y-%m-%dT%H:%M:%SZ") |" >> "$GITHUB_STEP_SUMMARY"
