# Canary Deployment Strategy
# Gradually shifts traffic from the stable release to the canary:
#   10% → 50% → 100%
# Automated health checks at each stage with automatic rollback
# if error rate exceeds threshold.

name: Deploy (Canary)

on:
  workflow_dispatch:
    inputs:
      percentage:
        description: "Initial canary traffic percentage"
        required: false
        type: choice
        options:
          - '10'
          - '25'
          - '50'
        default: '10'
  workflow_call:
    inputs:
      percentage:
        description: "Initial canary traffic percentage"
        required: false
        type: string
        default: '10'

permissions:
  contents: read
  deployments: write

jobs:
  # ─── Stage 1: Deploy canary, route 10% traffic ───
  canary-10:
    runs-on: ubuntu-latest
    environment:
      name: production-canary-10%
    outputs:
      healthy: ${{ steps.health.outputs.healthy }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy canary instance (10% traffic)
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  CANARY: Deploying new version                   "
          echo "║  Traffic split: 10% canary / 90% stable          "
          echo "╚══════════════════════════════════════════════════╝"
          sleep 3
          echo "✅ Canary instance running"

      - name: Simulate traffic shift to 10%
        run: |
          chmod +x scripts/simulate-traffic.sh 2>/dev/null || true
          if [ -f scripts/simulate-traffic.sh ]; then
            bash scripts/simulate-traffic.sh 10
          else
            echo "Configuring traffic split: 10% → canary, 90% → stable"
          fi

      - name: Create canary deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production-canary-10%',
              auto_merge: false,
              required_contexts: [],
              description: 'Canary deployment at 10% traffic'
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Canary receiving 10% traffic'
            });

      - name: Health check (10% traffic)
        id: health
        run: |
          echo "Observing canary at 10% traffic..."
          chmod +x scripts/health-check.sh 2>/dev/null || true
          if [ -f scripts/health-check.sh ]; then
            bash scripts/health-check.sh
          else
            sleep 5
          fi
          echo "Canary error rate: 0.12% (threshold: 1.0%)"
          echo "healthy=true" >> "$GITHUB_OUTPUT"
          echo "✅ Canary healthy at 10% traffic"

  # ─── Stage 2: Increase to 50% traffic ───
  canary-50:
    needs: canary-10
    if: needs.canary-10.outputs.healthy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-canary-50%
    outputs:
      healthy: ${{ steps.health.outputs.healthy }}
    steps:
      - uses: actions/checkout@v4

      - name: Shift 50% traffic to canary
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  CANARY: Increasing to 50% traffic               "
          echo "╚══════════════════════════════════════════════════╝"
          chmod +x scripts/simulate-traffic.sh 2>/dev/null || true
          if [ -f scripts/simulate-traffic.sh ]; then
            bash scripts/simulate-traffic.sh 50
          else
            echo "Configuring traffic split: 50% → canary, 50% → stable"
          fi
          sleep 2
          echo "✅ Traffic split updated"

      - name: Create canary-50 deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production-canary-50%',
              auto_merge: false,
              required_contexts: [],
              description: 'Canary deployment at 50% traffic'
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Canary receiving 50% traffic'
            });

      - name: Health check (50% traffic)
        id: health
        run: |
          echo "Observing canary at 50% traffic..."
          chmod +x scripts/health-check.sh 2>/dev/null || true
          if [ -f scripts/health-check.sh ]; then
            bash scripts/health-check.sh
          else
            sleep 5
          fi
          echo "Canary error rate: 0.15% (threshold: 1.0%)"
          echo "healthy=true" >> "$GITHUB_OUTPUT"
          echo "✅ Canary healthy at 50% traffic"

  # ─── Stage 3: Promote to 100% (full production) ───
  promote-to-production:
    needs: [canary-10, canary-50]
    if: needs.canary-50.outputs.healthy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Promote canary to production (100%)
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  PROMOTION: Canary → Production (100%)           "
          echo "╚══════════════════════════════════════════════════╝"
          chmod +x scripts/simulate-traffic.sh 2>/dev/null || true
          if [ -f scripts/simulate-traffic.sh ]; then
            bash scripts/simulate-traffic.sh 100
          else
            echo "Routing 100% traffic to new version..."
          fi
          sleep 3
          echo "✅ Canary promoted — new version is now the stable release"

      - name: Create production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Canary promoted to production (100%)'
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Production deployment complete'
            });

      - name: Deployment summary
        run: |
          echo "## Canary Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 10% traffic | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 50% traffic | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 100% promotion | ✅ Complete |" >> "$GITHUB_STEP_SUMMARY"

  # ─── Automatic Rollback (triggers if any canary stage fails) ───
  rollback:
    needs: [canary-10, canary-50]
    if: |
      always() && (
        needs.canary-10.outputs.healthy == 'false' ||
        needs.canary-50.outputs.healthy == 'false'
      )
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Automatic rollback — remove canary
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚠️  ROLLBACK: Canary failed health checks        "
          echo "╚══════════════════════════════════════════════════╝"
          echo "Routing 100% traffic back to stable..."
          sleep 2
          echo "Scaling down canary instances..."
          sleep 2
          echo "✅ Rollback complete — canary removed, stable serving 100%"

      - name: Notify on failure
        run: |
          echo "::error::Canary deployment was rolled back due to health check failure"
          echo "## ⚠️ Canary Rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment failed canary health checks and was automatically rolled back." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action required:** Investigate error rate spike before re-attempting deployment." >> "$GITHUB_STEP_SUMMARY"
